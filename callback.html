<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok OAuth Callback — Niebla Relatos</title>
  <style>
    body { font-family: Georgia, serif; max-width: 40rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.55; color: #1a1a1a; }
    a { color: #333; }
  </style>
</head>
<body>
  <p><a href="./">Niebla Relatos</a></p>
  <h1>TikTok authorization</h1>
  <p id="msg">Processing authorization response…</p>
  <script>
    const q = new URLSearchParams(location.search);
    const err = q.get("error");
    const code = q.get("code");
    const el = document.getElementById("msg");
    if (err) el.textContent = "Authorization failed: " + err;
    else if (code) el.textContent = "Authorization received. You can return to the Niebla Relatos app.";
    else el.textContent = "Waiting for TikTok OAuth redirect parameters.";
  </script>
</body>
</html>
